<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layouts</title>
  <link rel="icon" href="valeMilk.jpg" type="image/jpg">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding-top: 100px; /* Espaço para a navbar fixa */
      background: #ffffff;
      text-align: center;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #65b0ff;
      padding: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    .navbar button {
      margin: 0 10px;
      padding: 12px 25px;
      font-size: 16px;
      background-color: #ffffff;
      color: #238eff;
      border: 2px solid #ffffff;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .navbar button:hover {
      background-color: #0056b3;
      color: #ffffff;
      border-color: #0056b3;
    }
    .navbar .logo img {
  height: 40px;
  max-height: 50px;
  border-radius: 5px;
}

    .container {
      padding: 30px;
    }

    img {
      max-width: 90%;
      height: auto;
      margin: 50px auto;
      display: block;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">
        <img src="valeMilk.jpg" alt="Vale Milk">
      </div>
  
    <button onclick="document.getElementById('imagem').scrollIntoView({behavior: 'smooth'})">Meia Porta</button>
    <button onclick="document.getElementById('imagem2').scrollIntoView({behavior: 'smooth'})">Layout por Categoria</button>
    <button onclick="document.getElementById('imagem3').scrollIntoView({behavior: 'smooth'})">Layout Duas Portas</button>
    <button onclick="document.getElementById('imagem4').scrollIntoView({behavior: 'smooth'})">Modelo 2</button>
  </div>

  <div class="container">
    <div class="text-center">
      <img src="valeMilk.jpg" alt="Logo" class="img-fluid" style="max-width: 200px;">
    </div>

    <h1>Layouts Produtos Vale Milk</h1>

    <div id="imagem">
      <img src="Meio porta 2.jpg" alt="Layout Meio Porta">
    </div>

    <div id="imagem2">
      <img src="Modelo Por Categoria.jpg" alt="Layout por Categoria">
    </div>

    <div id="imagem3">
      <img src="Duas Portas.jpg" alt="Layout Duas Portas">
    </div>

    <div id="imagem4">
      <img src="Duas portas modelo 2.jpg" alt="Layout Duas Portas Modelo 2">
    </div>
  </div>

</body>
</html>
